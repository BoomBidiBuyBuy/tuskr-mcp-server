[project]
name = "tuskr-mcp-server"
version = "0.1.4"
description = "MCP server for the Tuskr test management REST API"
authors = [
    { name = "Ruslan Galinskii", email = "galinskyifmo@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "fastmcp>=3.0,<5",
    "requests>=2.32.4",
]
keywords = ["mcp", "tuskr", "model-context-protocol"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "ruff==0.16.10",
]

[project.urls]
Homepage = "https://github.com/BoomBidiBuyBuy/tuskr-mcp-server"
Repository = "https://github.com/BoomBidiBuyBuy/tuskr-mcp-server.git"
"Bug Tracker" = "https://github.com/BoomBidiBuyBuy/tuskr-mcp-server/issues"

[project.scripts]
tuskr-mcp-server = "main:main"
