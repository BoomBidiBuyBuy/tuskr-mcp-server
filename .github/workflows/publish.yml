name: Publish Python Package

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"

      - name: Build package
        run: uv build

      # Authenticates through PyPI trusted publishing (OIDC), which is how the
      # published releases were uploaded; no API token is needed.
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
