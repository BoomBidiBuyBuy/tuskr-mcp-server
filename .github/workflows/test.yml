name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Without this, uv follows .python-version and every matrix job would
      # run the same interpreter.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.23"

    - name: Install dependencies
      run: uv sync --locked

    - name: Show interpreter
      run: uv run python --version

    - name: Run tests
      run: uv run pytest -vs
